services:
  web:
    build:
      context: ./service
    container_name: p1-web
    environment:
      NOTES_DB: /data/notes.db
      UPLOAD_DIR: /srv/app/uploads
      CANARY_PATH: /srv/canary.txt
    volumes:
      - notes:/data
      # The source the service actually loads. A bind mount keeps the running
      # service and the file ctfctl patches in sync, exactly like a patcher on a
      # real attack/defense box. Read-only, so the container can never rewrite it.
      - ./service/app.py:/srv/app/app.py:ro
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  proxy:
    image: nginx:1.27-alpine
    container_name: p1-proxy
    depends_on:
      - web
    ports:
      - "8080:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  notes: {}
