server {
    listen 80;
    server_name _;

    # Deliberately no client_max_body_size relaxation and no proxy buffering
    # tricks: the fixture must stay boring apart from the one planted defect.
    client_max_body_size 1m;

    location / {
        # No URI part after the upstream, so the raw request URI (including any
        # percent-encoded separators) is forwarded to the application.
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
